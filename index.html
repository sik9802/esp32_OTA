<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESP32 OTA Manager</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; color: #1a1a1a; min-height: 100vh; }
  .dash { max-width: 520px; margin: 0 auto; padding: 1.25rem 1rem; }
  .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem; }
  .topbar-title { font-size: 17px; font-weight: 600; }
  .device-id { font-size: 12px; color: #888; background: #ebebeb; padding: 3px 8px; border-radius: 6px; margin-left: 8px; }
  .conn-pill { display: flex; align-items: center; gap: 5px; font-size: 12px; padding: 5px 12px; border-radius: 20px; border: 1px solid #ddd; background: #fff; cursor: pointer; user-select: none; }
  .conn-pill.on { background: #eaf6ee; border-color: #52b26a; color: #2a7a42; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #ccc; }
  .conn-pill.on .dot { background: #52b26a; }

  /* OTA Card */
  .ota-card { background: #fff; border: 1px solid #e8e8e8; border-radius: 12px; padding: 1rem 1.1rem; margin-bottom: 1rem; }
  .ota-title { font-size: 13px; font-weight: 600; margin-bottom: 0.75rem; }
  .ota-url-row { display: flex; gap: 8px; margin-bottom: 0.75rem; }
  .ota-url-input { flex: 1; font-size: 12px; padding: 7px 10px; border-radius: 8px; border: 1px solid #ddd; background: #fafafa; color: #1a1a1a; outline: none; min-width: 0; }
  .ota-url-input:focus { border-color: #888; background: #fff; }
  .btn-ota { padding: 7px 16px; font-size: 13px; font-weight: 500; cursor: pointer; border-radius: 8px; border: none; background: #1a1a1a; color: #fff; white-space: nowrap; }
  .btn-ota:hover { background: #333; }
  .btn-ota:disabled { background: #ccc; cursor: not-allowed; }
  .ota-select-row { display: flex; gap: 8px; margin-bottom: 0.75rem; align-items: center; }
  .ota-select-label { font-size: 11px; color: #888; white-space: nowrap; }
  .ota-select { flex: 1; font-size: 12px; padding: 6px 10px; border-radius: 8px; border: 1px solid #ddd; background: #fafafa; color: #1a1a1a; outline: none; cursor: pointer; }
  .ota-select:focus { border-color: #888; background: #fff; }
  .ota-result { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; padding: 4px 10px; border-radius: 20px; background: #f0f0f0; color: #666; }
  .ota-result.ok { background: #eaf6ee; color: #2a7a42; }
  .ota-result.fail { background: #fdecea; color: #cc3333; }
  .ota-result.start { background: #fff8e1; color: #b07800; }

  /* Terminal Card */
  .term-card { background: #1a1a1a; border-radius: 12px; padding: 1rem; margin-bottom: 1rem; }
  .term-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.75rem; }
  .term-title { font-size: 12px; color: #888; display: flex; align-items: center; gap: 6px; }
  .term-dot { width: 6px; height: 6px; border-radius: 50%; background: #52b26a; }
  .term-dot.ota-active { background: #f0a030; }
  .term-dot.off { background: #555; }
  .term-controls { display: flex; gap: 6px; align-items: center; }
  .btn-term { font-size: 11px; padding: 3px 8px; border-radius: 5px; border: 1px solid #444; background: #2a2a2a; color: #888; cursor: pointer; }
  .btn-term:hover { background: #333; color: #aaa; }
  .btn-term.paused { background: #3a2a2a; border-color: #664; color: #f0a030; }
  .term-body { height: 200px; overflow-y: auto; font-family: 'Courier New', monospace; font-size: 11px; line-height: 1.6; }
  .term-body.ota-term { height: 160px; }
  .term-body::-webkit-scrollbar { width: 4px; }
  .term-body::-webkit-scrollbar-track { background: #1a1a1a; }
  .term-body::-webkit-scrollbar-thumb { background: #444; border-radius: 2px; }
  .log-line { padding: 1px 0; word-break: break-all; }
  .log-line .ts { color: #555; margin-right: 6px; }
  .log-i { color: #7ec8a0; }
  .log-w { color: #f0a030; }
  .log-e { color: #e05a5a; }
  .log-d { color: #888; }
  .log-sys { color: #5a9ae0; font-style: italic; }
  .log-ota { color: #f0c060; }

  /* Config Card */
  .cfg-card { background: #fff; border: 1px solid #e8e8e8; border-radius: 12px; overflow: hidden; margin-bottom: 1rem; }
  .cfg-header { display: flex; align-items: center; justify-content: space-between; padding: 0.75rem 1rem; cursor: pointer; }
  .cfg-header-left { font-size: 13px; font-weight: 500; }
  .cfg-chevron { font-size: 13px; color: #aaa; transition: transform 0.2s; }
  .cfg-body { padding: 0 1rem 1rem; display: none; }
  .cfg-body.open { display: block; }
  .cfg-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .cfg-field { display: flex; flex-direction: column; gap: 4px; }
  .cfg-field.full { grid-column: 1 / -1; }
  .cfg-field label { font-size: 11px; color: #888; }
  .cfg-field input { font-size: 13px; padding: 6px 9px; border-radius: 7px; border: 1px solid #ddd; background: #fafafa; color: #1a1a1a; width: 100%; outline: none; }
  .cfg-field input:focus { border-color: #888; background: #fff; }
  .cfg-footer { padding: 0.75rem 1rem; border-top: 1px solid #f0f0f0; }
  .btn-connect { width: 100%; padding: 8px; font-size: 13px; font-weight: 500; cursor: pointer; border-radius: 8px; border: 1px solid #ddd; background: #fafafa; color: #333; }
  .btn-connect:hover { background: #f0f0f0; }
  .btn-connect.active { background: #eaf6ee; border-color: #52b26a; color: #2a7a42; }
  .footer-bar { display: flex; justify-content: space-between; font-size: 11px; color: #bbb; padding: 0 2px; }
  .term-divider { font-size: 10px; color: #444; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; padding-bottom: 4px; border-bottom: 1px solid #2a2a2a; }
</style>
</head>
<body>
<div class="dash">
  <div class="topbar">
    <div style="display:flex;align-items:center">
      <span class="topbar-title">ESP32 OTA</span>
      <span class="device-id">device_01</span>
    </div>
    <div id="conn-pill" class="conn-pill" onclick="toggleConnect()">
      <span class="dot" id="dot"></span>
      <span id="conn-label">연결</span>
    </div>
  </div>

  <!-- OTA Card -->
  <div class="ota-card">
    <div class="ota-title">⬆ OTA 펌웨어 업데이트</div>
    <div class="ota-url-row">
      <input id="ota-url" class="ota-url-input" type="text"
        placeholder="펌웨어 URL (.bin)"
        value="https://github.com/sik9802/esp32_OTA/releases/latest/download/blink_test.bin">
      <button class="btn-ota" id="btn-ota" onclick="sendOta()" disabled>전송</button>
    </div>
    <div class="ota-select-row">
      <span class="ota-select-label">버전 선택</span>
      <select id="ota-select" class="ota-select" onchange="onSelectVersion()">
        <option value="">-- 불러오는 중... --</option>
      </select>
    </div>
    <div id="ota-result" class="ota-result">⏸ 대기 중</div>
  </div>

  <!-- OTA Log Terminal -->
  <div class="term-card">
    <div class="term-header">
      <div class="term-title">
        <span class="term-dot off" id="ota-term-dot"></span>
        OTA 로그
      </div>
      <div class="term-controls">
        <button class="btn-term" onclick="clearLog('ota-term-body')">지우기</button>
      </div>
    </div>
    <div class="term-body ota-term" id="ota-term-body">
      <div class="log-line log-sys">── OTA 이벤트 로그 ──</div>
    </div>
  </div>

  <!-- Config Portal Card -->
  <div class="ota-card" style="display:flex;flex-direction:column;gap:10px;">
    <div style="display:flex;align-items:center;justify-content:space-between;">
      <div>
        <div class="ota-title" style="margin-bottom:2px">⚙ Config Portal</div>
        <div style="font-size:11px;color:#888">ESP32 파라미터 원격 설정</div>
      </div>
      <button class="btn-ota" id="btn-portal" onclick="sendConfigEnter()" disabled>진입</button>
    </div>
    <div style="display:flex;gap:8px;align-items:center;">
      <input id="portal-ip" class="ota-url-input" type="text"
        placeholder="192.168.x.x (자동감지)" readonly
        style="cursor:default;color:#aaa;">
      <button class="btn-ota" id="btn-portal-open"
        onclick="openPortal()" disabled
        style="background:#444;">열기</button>
    </div>
    <div style="display:flex;gap:8px;align-items:center;margin-top:4px;">
     <button class="btn-ota" id="btn-restart"
       onclick="sendRestart()" disabled
       style="background:#c0392b;flex:1;">🔄 원격 재시작</button>
    </div>
  </div>

  <!-- App Log Terminal -->
  <div class="term-card">
    <div class="term-header">
      <div class="term-title">
        <span class="term-dot off" id="app-term-dot"></span>
        앱 실행 로그
      </div>
      <div class="term-controls">
        <button class="btn-term" id="btn-pause" onclick="toggleAppLog()">⏸ 일시정지</button>
        <button class="btn-term" onclick="toggleScroll()">▼ <span id="scroll-label">자동스크롤</span></button>
        <button class="btn-term" onclick="clearLog('app-term-body')">지우기</button>
      </div>
    </div>
    <div class="term-body" id="app-term-body">
      <div class="log-line log-sys">── MQTT 연결 후 로그가 표시됩니다 ──</div>
    </div>
  </div>

  <!-- Config Card -->
  <div class="cfg-card">
    <div class="cfg-header" onclick="toggleCfg()">
      <span class="cfg-header-left">⚙ 브로커 설정</span>
      <span class="cfg-chevron" id="cfg-chev">▾</span>
    </div>
    <div id="cfg-body" class="cfg-body">
      <div class="cfg-grid">
        <div class="cfg-field full">
          <label>Broker host</label>
          <input id="cfg-host" value="604efa86dab4428c9f2f4de139f5ca0a.s1.eu.hivemq.cloud">
        </div>
        <div class="cfg-field">
          <label>Username</label>
          <input id="cfg-user" value="chunsik">
        </div>
        <div class="cfg-field">
          <label>Password</label>
          <input id="cfg-pass" type="password" placeholder="패스워드">
        </div>
        <div class="cfg-field full">
          <label>OTA Topic</label>
          <input id="cfg-topic" value="ota/update">
        </div>
      </div>
      <div class="cfg-footer">
        <button class="btn-connect" id="btn-conn" onclick="toggleConnect()">연결</button>
      </div>
    </div>
  </div>

  <div class="footer-bar">
    <span id="last-action">마지막 수신: --</span>
    <span id="pub-count">수신 0건</span>
  </div>
</div>

<script>
let client = null;
let pubCount = 0;
let autoScroll = true;
let appLogPaused = false;
const MAX_LOG_LINES = 200;
const GITHUB_REPO = 'sik9802/esp32_OTA';
const BIN_FILENAME = 'blink_test.bin';

const OTA_TAGS = ['OTA', 'esp_https_ota', 'esp-x509-crt-bundle', 'esp_image', 'HTTP_CLIENT'];

function isOtaLog(raw) {
  return OTA_TAGS.some(tag => raw.includes(tag));
}

// ── GitHub Releases 동적 로드 ─────────────────
async function loadReleases() {
  const sel = document.getElementById('ota-select');
  try {
    const res = await fetch('https://api.github.com/repos/' + GITHUB_REPO + '/releases');
    const releases = await res.json();
    sel.innerHTML = '';
    const latestOpt = document.createElement('option');
    latestOpt.value = 'https://github.com/' + GITHUB_REPO + '/releases/latest/download/' + BIN_FILENAME;
    latestOpt.textContent = '⭐ latest (최신)';
    sel.appendChild(latestOpt);
    releases.forEach(r => {
      const asset = r.assets.find(a => a.name === BIN_FILENAME);
      if (!asset) return;
      const opt = document.createElement('option');
      opt.value = asset.browser_download_url;
      opt.textContent = r.tag_name + (r.prerelease ? ' (pre)' : '');
      sel.appendChild(opt);
    });
    const currentUrl = document.getElementById('ota-url').value;
    for (const opt of sel.options) {
      if (opt.value === currentUrl) { opt.selected = true; break; }
    }
  } catch (e) {
    sel.innerHTML = '<option value="">릴리즈 로드 실패</option>';
  }
}

function onSelectVersion() {
  const sel = document.getElementById('ota-select');
  if (sel.value) document.getElementById('ota-url').value = sel.value;
}

loadReleases();

function sendOta() {
  if (!client || !client.connected) { addOtaLog('SYS', 'MQTT가 연결되지 않았습니다.'); return; }
  const url = document.getElementById('ota-url').value.trim();
  if (!url) { addOtaLog('E', 'URL을 입력하세요.'); return; }
  const topic = document.getElementById('cfg-topic').value.trim();
  client.publish(topic, url, { qos: 1 }, (err) => {
    if (err) {
      setOtaResult('fail', '전송 실패: ' + err.message);
      addOtaLog('SYS', '전송 실패: ' + err.message);
    } else {
      setOtaResult('start', 'ESP32 OTA 시작 대기 중...');
      addOtaLog('SYS', '▶ OTA URL 전송 완료 → ' + url);
    }
  });
}

function sendConfigEnter() {
  if (!client || !client.connected) return;
  client.publish('config/enter', '1', { qos: 1 }, (err) => {
    if (err) {
      addAppLog('SYS', 'Config Portal 전송 실패: ' + err.message);
    } else {
      addAppLog('SYS', '▶ Config Portal 진입 명령 전송 완료');
      const ip = document.getElementById('portal-ip').value;
      if (ip) addAppLog('SYS', '브라우저에서 http://' + ip + ' 접속하세요');
      else    addAppLog('SYS', '브라우저에서 http://[ENC28J60_IP] 접속하세요');
    }
  });
}
 
function sendRestart() {
  if (!client || !client.connected) return;
  if (!confirm('ESP32를 재시작하시겠습니까?')) return;
  client.publish('device/restart', '1', { qos: 1 }, (err) => {
    if (err) {
      addAppLog('SYS', '재시작 명령 전송 실패: ' + err.message);
    } else {
      addAppLog('SYS', '🔄 원격 재시작 명령 전송 완료');
    }
  });
}
 
// ── IP 자동 감지 ───────────────────────────────
function tryParseIP(logStr) {
  const m = logStr.match(/IP 할당: ([\d.]+)/);
  if (m) {
    const ipInput = document.getElementById('portal-ip');
    ipInput.value = m[1];
    ipInput.style.color = '#7ec8a0';
    document.getElementById('btn-portal-open').disabled = false;
  }
}

function openPortal() {
  const ip = document.getElementById('portal-ip').value;
  if (ip) window.open('http://' + ip, '_blank');
}

function setOtaResult(type, msg) {
  const el = document.getElementById('ota-result');
  const icons = { ok: '✅', fail: '❌', start: '⏳', '': '⏸' };
  el.textContent = (icons[type] || '⏸') + ' ' + msg;
  el.className = 'ota-result ' + type;
}

function parseLogLine(raw) {
  const m = raw.match(/^([IWED])\s*\((\d+)\)\s+([^:]+):\s*(.*)/);
  if (m) return { level: m[1], time: m[2], tag: m[3].trim(), msg: m[4] };
  return { level: 'D', time: '', tag: '', msg: raw };
}

function buildLogElement(level, raw, isSys) {
  const p = parseLogLine(raw);
  const line = document.createElement('div');
  const ts = new Date().toLocaleTimeString('ko-KR', { hour12: false });
  const levelClass = { I: 'log-i', W: 'log-w', E: 'log-e', D: 'log-d', SYS: 'log-sys' };
  const lv = (p.level !== 'D') ? p.level : level;
  if (isSys) {
    line.className = 'log-line log-sys';
    line.innerHTML = '<span class="ts">[' + ts + ']</span>' + raw;
  } else {
    line.className = 'log-line ' + (levelClass[lv] || 'log-d');
    const tag = p.tag ? '<span style="color:#aaa">[' + p.tag + ']</span> ' : '';
    const timeStr = p.time ? '<span style="color:#555">(' + p.time + 'ms)</span> ' : '';
    line.innerHTML = '<span class="ts">[' + ts + ']</span>' + tag + timeStr + p.msg;
  }
  return line;
}

function appendToTerminal(bodyId, lineEl, useAutoScroll) {
  const body = document.getElementById(bodyId);
  while (body.children.length >= MAX_LOG_LINES) body.removeChild(body.firstChild);
  body.appendChild(lineEl);
  if (useAutoScroll) body.scrollTop = body.scrollHeight;
}

function addOtaLog(level, raw) {
  const isSys = (level === 'SYS');
  const line = buildLogElement(level, raw, isSys);
  if (!isSys) line.classList.add('log-ota');
  appendToTerminal('ota-term-body', line, true);
}

function addAppLog(level, raw) {
  if (appLogPaused) return;
  tryParseIP(raw);
  const line = buildLogElement(level, raw, level === 'SYS');
  appendToTerminal('app-term-body', line, autoScroll);
}

function clearLog(bodyId) {
  const labels = { 'ota-term-body': 'OTA 로그 지움', 'app-term-body': '앱 로그 지움' };
  document.getElementById(bodyId).innerHTML =
    '<div class="log-line log-sys">── ' + (labels[bodyId] || '로그 지움') + ' ──</div>';
}

function toggleScroll() {
  autoScroll = !autoScroll;
  document.getElementById('scroll-label').textContent = autoScroll ? '자동스크롤' : '스크롤고정';
}

function toggleAppLog() {
  appLogPaused = !appLogPaused;
  const btn = document.getElementById('btn-pause');
  if (appLogPaused) {
    btn.textContent = '▶ 재개';
    btn.classList.add('paused');
    if (client && client.connected)
      client.publish('log/control', 'stop', { qos: 1 });
  } else {
    btn.textContent = '⏸ 일시정지';
    btn.classList.remove('paused');
    if (client && client.connected)
      client.publish('log/control', 'start', { qos: 1 });
  }
}

function setConnUI(state) {
  const pill = document.getElementById('conn-pill');
  const label = document.getElementById('conn-label');
  const btn = document.getElementById('btn-conn');
  const btnOta = document.getElementById('btn-ota');
  const appDot = document.getElementById('app-term-dot');
  const otaDot = document.getElementById('ota-term-dot');
  const btnPortal = document.getElementById('btn-portal');
  const btnRestart = document.getElementById('btn-restart');
  const ipInput = document.getElementById('portal-ip');

  if (state === 'connected') {
    pill.className = 'conn-pill on'; label.textContent = '연결됨';
    btn.textContent = '연결 해제'; btn.className = 'btn-connect active';
    btnOta.disabled = false;
    btnPortal.disabled = false;
    btnRestart.disabled = false;
    appDot.className = 'term-dot'; otaDot.className = 'term-dot ota-active';
    addAppLog('SYS', '── MQTT 연결됨. 로그 수신 시작 ──');
  } else if (state === 'connecting') {
    pill.className = 'conn-pill'; label.textContent = '연결 중...';
    btn.textContent = '취소';
    btnOta.disabled = true;
    btnPortal.disabled = true;
    appDot.className = 'term-dot off'; otaDot.className = 'term-dot off';
  } else {
    pill.className = 'conn-pill'; label.textContent = '연결';
    btn.textContent = '연결'; btn.className = 'btn-connect';
    btnOta.disabled = true;
    btnPortal.disabled = true;
    btnRestart.disabled = true;
    ipInput.value = '';
    ipInput.style.color = '#aaa';
    document.getElementById('btn-portal-open').disabled = true;
    appDot.className = 'term-dot off'; otaDot.className = 'term-dot off';
    addAppLog('SYS', '── MQTT 연결 해제 ──');
  }
}

function toggleConnect() {
  if (client && client.connected) { client.end(); client = null; setConnUI('disconnected'); return; }
  const host = document.getElementById('cfg-host').value.trim();
  const user = document.getElementById('cfg-user').value.trim();
  const pass = document.getElementById('cfg-pass').value;
  setConnUI('connecting');
  client = mqtt.connect('wss://' + host + ':8884/mqtt', { username: user, password: pass, reconnectPeriod: 0 });
  client.on('connect', () => {
    setConnUI('connected');
    client.subscribe('esp32/log');
    client.subscribe('ota/result');
    client.subscribe('config/enter');
     client.subscribe('esp32/info');
  });
  client.on('error', (e) => { setConnUI('disconnected'); addAppLog('SYS', '연결 오류: ' + e.message); });
  client.on('offline', () => setConnUI('disconnected'));
  client.on('message', (topic, msg) => {
    const str = msg.toString();
    pubCount++;
    const now = new Date().toLocaleTimeString('ko-KR');
    document.getElementById('last-action').textContent = '마지막 수신: ' + now;
    document.getElementById('pub-count').textContent = '수신 ' + pubCount + '건';
    if (topic === 'esp32/log') {
      const level = str.match(/^([IWED])\s/) ? str[0] : 'D';
      if (isOtaLog(str)) {
        addOtaLog(level, str);
      } else {
        addAppLog(level, str);
      }
    } else if (topic === 'ota/result') {
      try {
        const d = JSON.parse(str);
        setOtaResult(d.status, d.msg);
        addOtaLog('SYS', '▶ OTA 결과: ' + d.msg);
        if (d.status === 'ok') addOtaLog('SYS', '── ESP32 재시작 중... ──');
      } catch(e) {}
    } else if (topic === 'esp32/info') {      // ← 여기
    const ipInput = document.getElementById('portal-ip');
    ipInput.value = str;
    ipInput.style.color = '#7ec8a0';
    document.getElementById('btn-portal-open').disabled = false;
    addAppLog('SYS', '📡 ESP32 IP: ' + str);
    }
   
  });
}

function toggleCfg() {
  const body = document.getElementById('cfg-body');
  const chev = document.getElementById('cfg-chev');
  const open = body.classList.contains('open');
  body.classList.toggle('open');
  chev.style.transform = open ? '' : 'rotate(180deg)';
}
</script>
